name: Hiroshi Grill CI

# Lints, tests and builds the Hiroshi Master Grill reservation app, then runs
# its Row Level Security policies against a real Postgres.
#
# Two suites, deliberately separate:
#
#   npm test      132 endpoint, sign-in, dashboard and CSP tests. No server and
#                 no database, so they are fast and always run.
#   npm run db:test  43 policy tests. These need a Postgres the script can
#                 create a database on, which is what the service below is for.
#                 supabase/local/00-supabase-shim.sql stands in for the `auth`
#                 schema and the anon/authenticated roles, so no Supabase
#                 project is involved.
#
# The policy tests are the ones worth having in CI. Row Level Security is the
# only thing standing between a customer holding the public anon key and every
# reservation in the table; a policy silently loosened by a later migration
# would not fail any of the other tests.
#
# Only runs when something under hiroshi-grill/ changes.

on:
  push:
    branches:
      - main
    paths:
      - "hiroshi-grill/**"
      - ".github/workflows/hiroshi-ci.yml"
  pull_request:
    paths:
      - "hiroshi-grill/**"
      - ".github/workflows/hiroshi-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: hiroshi-grill

jobs:
  verify:
    name: Lint, test, build and check RLS policies
    runs-on: ubuntu-latest

    services:
      # The policy tests drop and recreate their own database, so this must be
      # a throwaway server and never anything real.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22, because `npm test` runs `node --test` directly over TypeScript
      # files and relies on the type stripping added in 22.18. On Node 20 the
      # test files fail to parse rather than reporting a version problem.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hiroshi-grill/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The build needs no secrets. Everything Supabase is read at request time,
      # and NEXT_PUBLIC_SITE_URL only affects metadata, so a missing value
      # cannot fail the build.
      - name: Build
        run: npm run build

      # No TEST_DATABASE_URL on purpose: without one the script creates and
      # drops its own database, which is what these PG* variables point it at.
      # psql comes with the runner image.
      - name: Check RLS policies
        run: npm run db:test
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
