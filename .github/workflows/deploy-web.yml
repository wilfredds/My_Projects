name: Deploy CycleMind AI (web demo)

# Builds the Flutter web app in mock mode (no Firebase / no API keys) and
# publishes it to GitHub Pages so it can be opened from any phone browser.
# Publishes to a `gh-pages` branch so it works from any source branch.

on:
  push:
    branches:
      - main
    paths:
      - "cyclemind_ai/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: write

# Shared with deploy-bike-guide.yml: both workflows push to gh-pages, and two
# concurrent pushes to the same branch race.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate platform folders (web)
        working-directory: cyclemind_ai
        run: flutter create . --platforms web

      - name: Install dependencies
        working-directory: cyclemind_ai
        run: flutter pub get

      - name: Analyze
        working-directory: cyclemind_ai
        run: flutter analyze
        continue-on-error: true

      - name: Run unit tests
        working-directory: cyclemind_ai
        run: flutter test
        continue-on-error: true

      # base-href has to match the path GitHub Pages serves this repo from,
      # which is /<repo name>/. Hardcoding it broke the demo once already: the
      # repo was renamed and the published build kept pointing at the old name,
      # so every asset 404'd. Read it off the event instead so a rename cannot
      # silently break the deploy again.
      - name: Build web (mock mode)
        working-directory: cyclemind_ai
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cyclemind_ai/build/web
          publish_branch: gh-pages
          # Not force_orphan: bike-guide-app/ is published to the same branch
          # by its own workflow, and orphaning would delete it.
          keep_files: true
          commit_message: "deploy(cyclemind): publish web demo to gh-pages"
