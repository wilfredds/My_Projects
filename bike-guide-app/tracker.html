<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ride Log - RidePH</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B5E3B">
  <script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||(t===null&&matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700;800&family=Overpass+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/system.css" rel="stylesheet">
  <style>
    /* Ride log. Same language as home: one guide sign to record a ride,
       numbers on hairlines, history as grouped lists. Everything is scoped
       under .tk and uses its own class names, so the older .ride-item /
       .stat-card rules in style.css and system.css don't apply. */
    .tk { padding: 16px 18px 28px; }

    .tk .sign-panel {
      display: flex; align-items: center; gap: 16px; padding: 16px 18px;
      background: var(--sign); color: var(--sign-ink); border-radius: 12px; text-decoration: none;
      box-shadow: inset 0 0 0 3px var(--sign), inset 0 0 0 5px rgba(255,255,255,0.92);
    }
    .tk .sign-arrow { width: 40px; height: 40px; flex-shrink: 0; }
    .tk .sign-arrow svg { display: block; width: 100%; height: 100%; }
    .tk .sign-title { display: block; font-size: 1.32rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; color: #fff; }
    .tk .sign-sub { display: block; font-size: 0.84rem; font-weight: 500; line-height: 1.35; color: rgba(255,255,255,0.88); margin-top: 3px; }

    .tk-stats { display: grid; grid-template-columns: 1fr 1fr; margin-top: 18px; border-top: 1px solid var(--hairline); }
    .tk-stats .st { padding: 12px 0 11px; border-bottom: 1px solid var(--hairline); min-width: 0; }
    .tk-stats .st:nth-child(even) { padding-left: 14px; border-left: 1px solid var(--hairline); }
    .tk-stats .v {
      display: block; white-space: nowrap; color: var(--ink);
      font-family: var(--font-num); font-weight: 600; font-size: 1.45rem; line-height: 1.1; letter-spacing: -0.03em;
    }
    .tk-stats .v small { font-size: 0.8rem; font-weight: 500; color: var(--ink-4); }
    .tk-stats .l { display: block; font-size: 0.76rem; color: var(--ink-3); margin-top: 2px; }

    .tk-log { margin-top: 18px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; }
    .tk-log summary {
      list-style: none; display: flex; align-items: center; gap: 12px; cursor: pointer;
      padding: 12px 14px; font-size: 0.95rem; font-weight: 700; color: var(--ink);
    }
    .tk-log summary::-webkit-details-marker { display: none; }
    .tk-log .plus {
      width: 32px; height: 32px; flex-shrink: 0; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: var(--sunken); color: var(--sign); font-size: 0.85rem;
    }
    [data-theme="dark"] .tk-log .plus { color: var(--brand); }
    .tk-log .chev { margin-left: auto; color: var(--ink-4); font-size: 0.8rem; transition: transform 0.15s linear; }
    .tk-log[open] .chev { transform: rotate(180deg); }
    .tk-form { padding: 2px 14px 16px; border-top: 1px solid var(--hairline); }
    .tk-form .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tk-form label { display: block; margin-top: 12px; min-width: 0; }
    .tk-form .lab { display: block; font-size: 0.78rem; font-weight: 700; color: var(--ink-2); margin-bottom: 5px; }
    .tk-form .opt { font-weight: 500; color: var(--ink-4); }
    .tk-form input, .tk-form textarea {
      display: block; width: 100%; min-width: 0; padding: 11px 12px;
      border: 1px solid var(--hairline); border-radius: 9px; background: var(--canvas); color: var(--ink);
      font: inherit; font-size: 0.95rem;
    }
    .tk-form textarea { resize: vertical; min-height: 64px; }
    .tk-form input::placeholder, .tk-form textarea::placeholder { color: var(--ink-4); }
    .tk-form input:focus, .tk-form textarea:focus { outline: none; border-color: var(--sign); box-shadow: 0 0 0 3px rgba(11,94,59,0.18); }
    .tk-form .num { font-family: var(--font-num); }
    .tk .tk-pace { font-family: var(--font-num); font-size: 0.78rem; color: var(--ink-3); margin: 10px 0 0; min-height: 1.3em; }
    .tk .tk-pace.bad { color: var(--stop); }
    .tk-save {
      width: 100%; margin-top: 12px; padding: 13px; border: 0; border-radius: 10px; cursor: pointer;
      background: var(--sign); color: #fff; font: inherit; font-size: 0.98rem; font-weight: 700;
    }
    .tk-save:disabled { opacity: 0.6; cursor: default; }

    .tk-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 26px 2px 0; }
    .tk-h h2 { font-size: 0.8rem; font-weight: 700; color: var(--ink-3); margin: 0; letter-spacing: 0; text-transform: none; }
    .tk-hint { font-size: 0.74rem; color: var(--ink-4); }
    .tk .tk-status { font-size: 0.82rem; color: var(--ink-3); margin: 8px 2px 0; }
    .tk-month { margin-top: 12px; }
    .tk-month-h {
      display: flex; justify-content: space-between; gap: 12px; margin: 0 2px 6px;
      font-size: 0.8rem; font-weight: 700; color: var(--ink-2); letter-spacing: 0; text-transform: none;
    }
    .tk-month-h .sum { font-family: var(--font-num); font-weight: 500; color: var(--ink-3); white-space: nowrap; }
    .tk-rows { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; overflow: hidden; }
    .tk-swipe { position: relative; overflow: hidden; transition: height 0.25s ease, opacity 0.25s ease; }
    .tk-swipe + .tk-swipe { border-top: 1px solid var(--hairline); }
    .tk-del {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; gap: 8px;
      padding-right: 20px; border: 0; background: var(--stop); color: #fff; cursor: pointer;
      font: inherit; font-size: 0.88rem; font-weight: 700;
    }
    .tk-row {
      position: relative; z-index: 1; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center;
      padding: 11px 14px; background: var(--surface); touch-action: pan-y;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tk-swipe:focus-within .tk-row { transform: translateX(-104px); }
    .tk-thumb {
      width: 44px; height: 44px; border-radius: 9px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: var(--sunken); color: var(--ink-3); font-size: 0.95rem;
    }
    .tk-thumb svg { display: block; width: 44px; height: 44px; }
    .tk-thumb .trk { fill: none; stroke: var(--sign); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
    [data-theme="dark"] .tk-thumb .trk { stroke: var(--brand); }
    .tk-thumb .dot { fill: var(--ink); }
    .tk-info { min-width: 0; }
    .tk-name { display: block; font-size: 0.95rem; font-weight: 700; line-height: 1.25; color: var(--ink); }
    .tk-gps {
      display: inline-block; margin-left: 6px; padding: 1px 5px 0; vertical-align: 2px;
      border: 1px solid var(--hairline); border-radius: 4px;
      font-size: 0.58rem; font-weight: 800; letter-spacing: 0.06em; color: var(--ink-3);
    }
    .tk-meta { display: block; font-size: 0.78rem; line-height: 1.35; color: var(--ink-3); margin-top: 1px; }
    .tk-meta .n { font-family: var(--font-num); }
    .tk-note { display: block; font-size: 0.8rem; line-height: 1.35; color: var(--ink-2); margin-top: 3px; overflow-wrap: anywhere; }
    .tk-km { font-family: var(--font-num); font-weight: 600; font-size: 1.05rem; color: var(--ink); white-space: nowrap; }
    .tk-km small { font-size: 0.72rem; font-weight: 500; color: var(--ink-4); }
    .tk-empty {
      margin-top: 10px; padding: 22px 16px; text-align: center; font-size: 0.9rem; line-height: 1.5;
      color: var(--ink-3); background: var(--surface); border: 1px dashed var(--hairline); border-radius: 12px;
    }
    .tk-empty b { color: var(--ink-2); }
    .tk-retry {
      margin-top: 10px; padding: 9px 16px; border-radius: 9px; cursor: pointer;
      border: 1px solid var(--hairline); background: var(--canvas); color: var(--ink); font: inherit; font-weight: 700;
    }
  </style>
</head>
<body>
<div class="page-wrapper">
  <div class="top-bar">
    <a href="dashboard.html" aria-label="Back to home" style="color:#fff;margin-right:12px;"><i class="fa-solid fa-arrow-left"></i></a>
    <span class="app-name">Ride log</span>
    <div class="top-actions"><span class="rider-badge" id="rider-badge"></span></div>
  </div>

  <main class="tk">
    <a href="ride.html" class="sign-panel">
      <span class="sign-arrow" aria-hidden="true">
        <svg viewBox="0 0 40 40"><path d="M20 4 L34 19 H25 V36 H15 V19 H6 Z" fill="#fff"/></svg>
      </span>
      <span>
        <span class="sign-title">Record a ride</span>
        <span class="sign-sub">GPS, voice warnings for what's ahead, and live share</span>
      </span>
    </a>

    <div class="tk-stats" aria-label="Your totals">
      <div class="st"><span class="v" id="s-rides">0</span><span class="l">rides</span></div>
      <div class="st"><span class="v"><span id="s-km">0.0</span><small> km</small></span><span class="l">total distance</span></div>
      <div class="st"><span class="v"><span id="s-avg">0.0</span><small> km/h</small></span><span class="l">average speed</span></div>
      <div class="st"><span class="v"><span id="s-best">0.0</span><small> km</small></span><span class="l">longest ride</span></div>
    </div>

    <details class="tk-log" id="log">
      <summary>
        <span class="plus" aria-hidden="true"><i class="fa-solid fa-plus"></i></span>
        Log a ride you didn't record
        <i class="fa-solid fa-chevron-down chev" aria-hidden="true"></i>
      </summary>
      <form class="tk-form" id="log-form" novalidate>
        <div class="pair">
          <label><span class="lab">Distance (km)</span>
            <input class="num" type="number" id="f-dist" inputmode="decimal" min="0.1" max="400" step="0.1" placeholder="15.5" required></label>
          <label><span class="lab">Time (minutes)</span>
            <input class="num" type="number" id="f-dur" inputmode="numeric" min="1" max="1440" step="1" placeholder="60" required></label>
        </div>
        <p class="tk-pace" id="pace" aria-live="polite"></p>
        <label><span class="lab">Date</span>
          <input class="num" type="date" id="f-date" required></label>
        <label><span class="lab">Route <span class="opt">(optional)</span></span>
          <input type="text" id="f-route" maxlength="60" placeholder="BGC loop, Tagaytay…"></label>
        <label><span class="lab">Notes <span class="opt">(optional)</span></span>
          <textarea id="f-notes" rows="2" maxlength="300" placeholder="How was it?"></textarea></label>
        <button type="submit" class="tk-save" id="save-btn">Save ride</button>
      </form>
    </details>

    <div class="tk-h">
      <h2>Ride history</h2>
      <span class="tk-hint" id="swipe-hint" hidden>Swipe a ride left to delete</span>
    </div>
    <p class="tk-status" id="tk-status" hidden></p>
    <div id="rides-container"><p class="tk-status">Loading your rides…</p></div>
  </main>

  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>

<script type="module">
  import { initPage, toast, countUp } from './js/app.js';
  import { logRide, getRides, deleteRide, calcStats, localDate, cachedRides, cacheRides,
           getLocalTrack, moveLocalTrack, rideForResave } from './js/tracker.js';
  initPage('tracker');

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const MONTH = new Intl.DateTimeFormat('en-PH', { month: 'long', year: 'numeric' });
  const DAY   = new Intl.DateTimeFormat('en-PH', { weekday: 'short', month: 'short', day: 'numeric' });
  const parseDate = s => { const [y, m, d] = String(s || '').split('-').map(Number); return y && m && d ? new Date(y, m - 1, d) : null; };
  const dayLabel = s => { const d = parseDate(s); return d ? DAY.format(d) : ''; };
  const fmtDuration = min => { if (!min) return ''; const h = Math.floor(min / 60), m = min % 60; return h ? `${h} h${m ? ` ${m} min` : ''}` : `${m} min`; };
  const speedOf = r => r.avgSpeedKmh ?? (r.durationMinutes ? r.distanceKm / (r.durationMinutes / 60) : null);

  let rides = [];

  // ── Form ──
  $('f-date').value = localDate();
  $('f-date').max = localDate();

  function problem(dist, dur, date) {
    if (!(dist > 0)) return 'Enter the distance in km.';
    if (dist > 400) return 'That distance looks too long. Check the km.';
    if (!(dur >= 1)) return 'Enter how long the ride took, in minutes.';
    if (dur > 1440) return "That's more than a day. Check the minutes.";
    const kmh = dist / (dur / 60);
    if (kmh > 60) return `That works out to ${kmh.toFixed(0)} km/h. Check the distance and time.`;
    if (!date) return 'Pick the date of the ride.';
    if (date > localDate()) return "The date can't be in the future.";
    return null;
  }

  function showPace() {
    const dist = parseFloat($('f-dist').value), dur = parseInt($('f-dur').value, 10);
    const el = $('pace');
    if (dist > 0 && dur > 0) {
      const kmh = dist / (dur / 60);
      el.textContent = kmh > 60 ? `${kmh.toFixed(1)} km/h — too fast to be right` : `${kmh.toFixed(1)} km/h average`;
      el.classList.toggle('bad', kmh > 60);
    } else { el.textContent = ''; el.classList.remove('bad'); }
  }
  $('f-dist').addEventListener('input', showPace);
  $('f-dur').addEventListener('input', showPace);

  $('log-form').addEventListener('submit', async e => {
    e.preventDefault();
    const dist = parseFloat($('f-dist').value);
    const dur  = parseInt($('f-dur').value, 10);
    const date = $('f-date').value;
    const err = problem(dist, dur, date);
    if (err) { toast(err, { type: 'error' }); return; }
    const btn = $('save-btn');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      await logRide({
        distanceKm: Math.round(dist * 10) / 10, durationMinutes: dur, date, source: 'manual',
        routeName: $('f-route').value.trim(), notes: $('f-notes').value.trim(),
      });
      ['f-dist', 'f-dur', 'f-route', 'f-notes'].forEach(id => { $(id).value = ''; });
      showPace();
      toast(`Saved: ${dist} km on ${dayLabel(date)}.`, { type: 'success' });
      await loadRides();
    } catch (_) {
      toast("Couldn't save the ride. Check your connection.", { type: 'error' });
    } finally {
      btn.disabled = false; btn.textContent = 'Save ride';
    }
  });

  // ── Stats ──
  function setStats(list, animate) {
    const s = calcStats(list);
    const put = (id, v, d) => animate ? countUp($(id), v, { decimals: d }) : ($(id).textContent = Number(v).toFixed(d));
    put('s-rides', s.totalRides, 0);
    put('s-km', s.totalKm, 1);
    put('s-avg', s.avgSpeed, 1);
    put('s-best', s.longestRide, 1);
  }

  // ── History ──
  // GPS track thumbnail from the copy kept on this phone (north up).
  function trackSvg(pts) {
    const lats = pts.map(p => p[0]), lngs = pts.map(p => p[1]);
    const minLat = Math.min(...lats), maxLat = Math.max(...lats), minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
    const S = 44, pad = 7;
    const kx = Math.cos(((minLat + maxLat) / 2) * Math.PI / 180);
    const spanX = Math.max((maxLng - minLng) * kx, 1e-6), spanY = Math.max(maxLat - minLat, 1e-6);
    const scale = Math.min((S - 2 * pad) / spanX, (S - 2 * pad) / spanY);
    const ox = (S - spanX * scale) / 2, oy = (S - spanY * scale) / 2;
    const xy = pts.map(([lat, lng]) => [ox + (lng - minLng) * kx * scale, S - (oy + (lat - minLat) * scale)]);
    const line = xy.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
    return `<svg viewBox="0 0 ${S} ${S}" aria-hidden="true"><polyline class="trk" points="${line}"/><circle class="dot" cx="${xy[0][0].toFixed(1)}" cy="${xy[0][1].toFixed(1)}" r="2.6"/></svg>`;
  }

  function thumb(r) {
    const t = r.source === 'gps' ? getLocalTrack(r.id) : null;
    if (t && t.length > 1) return `<span class="tk-thumb">${trackSvg(t)}</span>`;
    return `<span class="tk-thumb"><i class="fa-solid ${r.source === 'gps' ? 'fa-location-arrow' : 'fa-pen'}" aria-hidden="true"></i></span>`;
  }

  function rowHtml(r) {
    const name = r.routeName || (r.source === 'gps' ? 'Recorded ride' : 'Ride');
    const kmh = speedOf(r);
    const when = [dayLabel(r.date), fmtDuration(r.durationMinutes)].filter(Boolean).map(esc).join(' · ');
    const how = [
      kmh ? `<span class="n">${esc(Number(kmh).toFixed(1))}</span> km/h` : '',
      r.source === 'gps' && r.elevGainM ? `+<span class="n">${esc(Math.round(r.elevGainM))}</span> m climb` : '',
      r.source === 'gps' && r.calories ? `about ${esc(Math.round(r.calories))} kcal` : '',
    ].filter(Boolean).join(' · ');
    return `
      <div class="tk-swipe" data-id="${esc(r.id)}">
        <button type="button" class="tk-del" aria-label="Delete ${esc(name)}, ${esc(dayLabel(r.date))}">Delete <i class="fa-solid fa-trash" aria-hidden="true"></i></button>
        <div class="tk-row">
          ${thumb(r)}
          <span class="tk-info">
            <span class="tk-name">${esc(name)}${r.source === 'gps' ? '<span class="tk-gps">GPS</span>' : ''}</span>
            <span class="tk-meta">${when}</span>
            ${how ? `<span class="tk-meta">${how}</span>` : ''}
            ${r.notes ? `<span class="tk-note">${esc(r.notes)}</span>` : ''}
          </span>
          <span class="tk-km">${esc(r.distanceKm.toFixed(1))}<small> km</small></span>
        </div>
      </div>`;
  }

  function renderRides() {
    const box = $('rides-container');
    $('swipe-hint').hidden = !rides.length;
    if (!rides.length) {
      box.innerHTML = '<div class="tk-empty">No rides yet.<br>Tap <b>Record a ride</b> above, or log one you did without the app.</div>';
      return;
    }
    const months = new Map();
    for (const r of rides) {
      const key = (r.date || '').slice(0, 7);
      if (!months.has(key)) months.set(key, []);
      months.get(key).push(r);
    }
    box.innerHTML = [...months].map(([key, list]) => {
      const first = parseDate(`${key}-01`);
      const km = list.reduce((s, r) => s + r.distanceKm, 0);
      return `
        <section class="tk-month">
          <h3 class="tk-month-h"><span>${first ? esc(MONTH.format(first)) : 'Undated'}</span>
            <span class="sum">${list.length} ride${list.length === 1 ? '' : 's'} · ${km.toFixed(1)} km</span></h3>
          <div class="tk-rows">${list.map(rowHtml).join('')}</div>
        </section>`;
    }).join('');
    attachSwipe();
  }

  // Swipe left to reveal Delete; a long swipe deletes straight away.
  // Keyboard users reach the same button with Tab (the row slides aside).
  function attachSwipe() {
    const OPEN = -104;
    document.querySelectorAll('.tk-swipe').forEach(row => {
      const item = row.querySelector('.tk-row');
      let x0 = 0, y0 = 0, dx = 0, active = false, horizontal = null, wasOpen = false;
      item.addEventListener('pointerdown', e => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        document.querySelectorAll('.tk-row').forEach(o => { if (o !== item) o.style.transform = ''; });
        active = true; horizontal = null; dx = 0; x0 = e.clientX; y0 = e.clientY;
        wasOpen = item.style.transform.includes(`${OPEN}px`);
        item.style.transition = 'none';
      });
      item.addEventListener('pointermove', e => {
        if (!active) return;
        const mx = e.clientX - x0, my = e.clientY - y0;
        if (horizontal === null) {
          if (Math.abs(mx) < 6 && Math.abs(my) < 6) return;
          horizontal = Math.abs(mx) > Math.abs(my);
          if (horizontal) { try { item.setPointerCapture(e.pointerId); } catch (_) {} }
        }
        if (!horizontal) return;
        const base = wasOpen ? OPEN : 0;
        dx = base + (mx > 0 ? mx * (wasOpen ? 1 : 0.25) : mx);
        item.style.transform = `translateX(${Math.min(dx, 0)}px)`;
      });
      const end = () => {
        if (!active) return;
        active = false;
        item.style.transition = '';
        if (!horizontal) { if (wasOpen) item.style.transform = ''; return; }
        if (dx < -row.clientWidth * 0.45) { item.style.transform = 'translateX(-110%)'; removeRide(row); }
        else if (dx < OPEN / 2) item.style.transform = `translateX(${OPEN}px)`;
        else item.style.transform = '';
      };
      item.addEventListener('pointerup', end);
      item.addEventListener('pointercancel', end);
      row.querySelector('.tk-del').addEventListener('click', () => {
        item.style.transform = 'translateX(-110%)';
        removeRide(row);
      });
    });
  }

  // Deletes right away (a delayed delete is lost if you leave the page —
  // there's no offline queue here); Undo saves the ride again.
  async function removeRide(row) {
    const id = row.dataset.id;
    const ride = rides.find(r => r.id === id);
    if (!ride || row.dataset.gone) return;
    row.dataset.gone = '1';
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (_) {} }
    rides = rides.filter(r => r.id !== id);
    cacheRides(rides);
    setStats(rides, false);
    row.style.height = `${row.offsetHeight}px`;
    requestAnimationFrame(() => { row.style.height = '0px'; row.style.opacity = '0'; });
    setTimeout(renderRides, 260);
    try {
      await deleteRide(id);
    } catch (_) {
      toast("Couldn't delete the ride. Check your connection.", { type: 'error' });
      loadRides();
      return;
    }
    toast('Ride deleted', {
      type: 'info', duration: 5000,
      action: { label: 'Undo', onClick: async () => {
        try {
          const ref = await logRide(rideForResave(ride));
          moveLocalTrack(id, ref.id);
        } catch (_) {
          toast("Couldn't restore the ride. Check your connection.", { type: 'error' });
        }
        loadRides();
      } },
    });
  }

  // ── Load: last-known list first, then the live one ──
  let painted = false;
  async function loadRides() {
    if (!painted) {
      const cached = cachedRides();
      if (cached) { rides = cached; setStats(rides, false); renderRides(); painted = true; }
    }
    try {
      rides = await getRides();
      setStats(rides, !painted);
      renderRides();
      painted = true;
      $('tk-status').hidden = true;
      if (!rides.length) $('log').open = true;
    } catch (_) {
      if (painted) {
        $('tk-status').textContent = "You're offline. Showing your rides from the last time you were connected.";
        $('tk-status').hidden = false;
      } else {
        $('rides-container').innerHTML = `<div class="tk-empty">Couldn't load your rides. Check your connection.<br>
          <button type="button" class="tk-retry" id="retry">Try again</button></div>`;
        $('retry').addEventListener('click', () => {
          $('rides-container').innerHTML = '<p class="tk-status">Loading your rides…</p>';
          loadRides();
        });
      }
    }
  }

  loadRides();
</script>
<script src="js/sw-register.js"></script>
</body>
</html>
