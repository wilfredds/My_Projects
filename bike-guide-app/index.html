<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RidePH</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B5E3B">
  <script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||(t===null&&matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700;800&family=Overpass+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/system.css" rel="stylesheet">
  <style>
    /* Onboarding. Same language as home: one guide sign, then plain type on
       concrete. Scoped under .onb so style.css's [data-theme="dark"] p rule
       cannot recolour anything here. */
    body { padding-bottom: 0; min-height: 100vh; min-height: 100dvh; }
    .onb {
      max-width: 440px; margin: 0 auto;
      padding: 20px 18px calc(28px + env(safe-area-inset-bottom));
    }

    .onb .sign {
      background: var(--sign); color: var(--sign-ink);
      border-radius: 12px; padding: 22px 20px 20px;
      box-shadow: inset 0 0 0 3px var(--sign), inset 0 0 0 5px rgba(255,255,255,0.92);
    }
    .onb .sign-top { display: flex; align-items: center; justify-content: space-between; }
    .onb .sign-name {
      font-size: 2.3rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; margin: 0; color: #fff;
    }
    .onb .sign-arrow { width: 40px; height: 40px; flex-shrink: 0; }
    .onb .sign-arrow svg { display: block; width: 100%; height: 100%; }
    .onb .sign-line {
      margin: 12px 0 0; padding-top: 12px;
      border-top: 2px solid rgba(255,255,255,0.92);
      font-size: 1rem; font-weight: 600; line-height: 1.35; color: #fff;
    }

    .onb .does { margin: 18px 2px 0; padding: 0; list-style: none; }
    .onb .does li {
      display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start;
      padding: 9px 0; font-size: 0.92rem; line-height: 1.4; color: var(--ink-2);
    }
    .onb .does li + li { border-top: 1px solid var(--hairline); }
    .onb .does i { color: var(--sign); font-size: 0.9rem; margin-top: 3px; text-align: center; }
    [data-theme="dark"] .onb .does i { color: var(--brand); }
    .onb .does strong { color: var(--ink); font-weight: 700; }

    .onb .q {
      font-size: 0.8rem; font-weight: 700; color: var(--ink-3);
      margin: 24px 0 8px 2px; letter-spacing: 0; text-transform: none;
    }
    .onb .levels {
      background: var(--surface); border: 1px solid var(--hairline);
      border-radius: 12px; overflow: hidden;
    }
    .onb .level-card {
      display: grid; grid-template-columns: 1fr 22px; gap: 14px; align-items: center;
      width: 100%; padding: 13px 16px; margin: 0;
      background: transparent; border: 0; border-radius: 0; box-shadow: none;
      text-align: left; color: var(--ink); cursor: pointer; font: inherit;
      transform: none;
    }
    .onb .level-card + .level-card { border-top: 1px solid var(--hairline); }
    .onb .level-name { display: block; font-size: 1rem; font-weight: 700; color: var(--ink); }
    .onb .level-desc { display: block; font-size: 0.82rem; color: var(--ink-3); margin-top: 2px; line-height: 1.35; }
    .onb .level-desc .km { font-family: var(--font-num); color: var(--ink-2); }
    .onb .radio {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--ink-4); background: var(--surface);
    }
    .onb .level-card.selected { background: var(--sunken); }
    .onb .level-card.selected .radio {
      border-color: var(--sign); background: var(--sign);
      box-shadow: inset 0 0 0 4px var(--surface);
    }
    [data-theme="dark"] .onb .level-card.selected .radio { border-color: var(--brand); background: var(--brand); }
    .onb .level-card:focus-visible { outline: 2px solid var(--sign); outline-offset: -2px; }

    .onb .start-btn {
      width: 100%; margin-top: 18px; padding: 15px 16px;
      border: 0; border-radius: 10px;
      background: var(--sign); color: #fff; box-shadow: none;
      font: inherit; font-size: 1.02rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      cursor: pointer; transition: background 0.12s linear, opacity 0.12s linear;
    }
    .onb .start-btn:disabled { background: var(--sunken); color: var(--ink-4); cursor: not-allowed; }
    .onb .start-btn .hint { font-weight: 500; }

    .onb .lang {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-top: 22px;
    }
    .onb .lang-label { font-size: 0.85rem; color: var(--ink-3); }
    .onb .seg {
      display: inline-flex; padding: 3px; gap: 3px;
      background: var(--sunken); border-radius: 9px;
    }
    .onb .lang-opt {
      border: 0; background: transparent; color: var(--ink-3);
      padding: 7px 14px; border-radius: 7px;
      font: inherit; font-size: 0.85rem; font-weight: 700; cursor: pointer;
    }
    .onb .lang-opt.active { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--hairline); }

    .onb .already-link {
      display: block; width: 100%; margin-top: 18px; padding: 10px 0;
      background: none; border: 0; font: inherit;
      font-size: 0.85rem; color: var(--ink-3); text-align: center; cursor: pointer;
      text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--ink-4);
    }
  </style>
</head>
<body>
  <main class="onb">

    <header class="sign">
      <div class="sign-top">
        <h1 class="sign-name">RidePH</h1>
        <span class="sign-arrow" aria-hidden="true">
          <svg viewBox="0 0 40 40"><path d="M20 4 L34 19 H25 V36 H15 V19 H6 Z" fill="#fff"/></svg>
        </span>
      </div>
      <p class="sign-line">Know what's ahead on every Philippine road</p>
    </header>

    <ul class="does">
      <li><i class="fa-solid fa-volume-high" aria-hidden="true"></i><span><strong>Spoken warnings</strong> for potholes, floods and road works ahead of you</span></li>
      <li><i class="fa-solid fa-location-dot" aria-hidden="true"></i><span><strong>Live location</strong> your family can follow while you ride</span></li>
      <li><i class="fa-solid fa-shield-halved" aria-hidden="true"></i><span><strong>Bike registry</strong> so a stolen bike can be checked by serial</span></li>
    </ul>

    <p class="q" id="level-q">How much do you ride?</p>
    <div class="levels" id="level-cards" role="radiogroup" aria-labelledby="level-q">
      <button type="button" class="level-card no-ripple" data-level="beginner" role="radio" aria-checked="false" onclick="selectLevel(this)">
        <span>
          <span class="level-name">Beginner</span>
          <span class="level-desc">Short rides, around <span class="km">5–10 km</span>. Still learning the basics.</span>
        </span>
        <span class="radio" aria-hidden="true"></span>
      </button>
      <button type="button" class="level-card no-ripple" data-level="intermediate" role="radio" aria-checked="false" onclick="selectLevel(this)">
        <span>
          <span class="level-name">Intermediate</span>
          <span class="level-desc">Ride most weeks, <span class="km">20–40 km</span>. Building endurance.</span>
        </span>
        <span class="radio" aria-hidden="true"></span>
      </button>
      <button type="button" class="level-card no-ripple" data-level="advanced" role="radio" aria-checked="false" onclick="selectLevel(this)">
        <span>
          <span class="level-name">Advanced</span>
          <span class="level-desc">Long rides, <span class="km">60 km+</span>. Chasing climbs and distance.</span>
        </span>
        <span class="radio" aria-hidden="true"></span>
      </button>
    </div>

    <button class="start-btn no-ripple" id="start-btn" onclick="startApp()" disabled>
      <span id="start-label" class="hint">Pick one to continue</span>
    </button>

    <div class="lang">
      <span class="lang-label" id="lang-q">Language</span>
      <div class="seg" role="group" aria-labelledby="lang-q">
        <button type="button" class="lang-opt active no-ripple" id="btn-en" aria-pressed="true" onclick="chooseLang('en')">English</button>
        <button type="button" class="lang-opt no-ripple" id="btn-tl" aria-pressed="false" onclick="chooseLang('tl')">Tagalog</button>
      </div>
    </div>

    <button type="button" class="already-link no-ripple" onclick="goToDashboard()">Already set up? Go to home</button>
  </main>

  <script>
    // Check if already onboarded — skip to dashboard
    try {
      if (localStorage.getItem('riderLevel') && localStorage.getItem('bikeUserId')) {
        window.location.replace('dashboard.html');
      }
      // Generate user ID on first visit
      if (!localStorage.getItem('bikeUserId')) {
        localStorage.setItem('bikeUserId', crypto.randomUUID());
      }
    } catch (_) {}

    let selectedLevel = null;

    function selectLevel(card) {
      document.querySelectorAll('.level-card').forEach(c => {
        c.classList.remove('selected');
        c.setAttribute('aria-checked', 'false');
      });
      card.classList.add('selected');
      card.setAttribute('aria-checked', 'true');
      selectedLevel = card.dataset.level;
      const btn = document.getElementById('start-btn');
      btn.disabled = false;
      const label = document.getElementById('start-label');
      label.className = '';
      label.textContent = 'Start riding';
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch (_) {} }
    }

    function startApp() {
      if (!selectedLevel) return;
      try { localStorage.setItem('riderLevel', selectedLevel); } catch (_) {}
      window.location.href = 'dashboard.html';
    }

    function goToDashboard() {
      window.location.href = 'dashboard.html';
    }

    function chooseLang(lang) {
      try { localStorage.setItem('lang', lang); } catch (_) {}
      ['en', 'tl'].forEach(l => {
        const b = document.getElementById('btn-' + l);
        b.classList.toggle('active', l === lang);
        b.setAttribute('aria-pressed', l === lang ? 'true' : 'false');
      });
    }

    // Restore a language chosen on an earlier visit.
    try { const saved = localStorage.getItem('lang'); if (saved === 'tl' || saved === 'en') chooseLang(saved); } catch (_) {}
  </script>

  <script type="module">
    // Haptics and toasts; ripples are opted out above with .no-ripple.
    import { initUI } from './js/ui.js';
    initUI();
  </script>

  <script src="js/sw-register.js"></script>
</body>
</html>
