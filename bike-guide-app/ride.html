<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b4332">
  <title>Ride — Kasama</title>
  <link rel="icon" href="assets/icons/favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: 'Poppins', sans-serif; background: #0e1512; }
    #map { position: absolute; inset: 0; }

    /* ── Top HUD: live stats ── */
    .hud-top {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px 12px;
      background: linear-gradient(to bottom, rgba(10,20,16,0.92), rgba(10,20,16,0));
      display: flex; gap: 10px; align-items: flex-start;
      pointer-events: none;
    }
    .back-btn {
      pointer-events: auto;
      width: 42px; height: 42px; flex-shrink: 0;
      background: rgba(255,255,255,0.14); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.18); border-radius: 13px;
      color: #fff; font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
    }
    .stats { flex: 1; display: flex; gap: 8px; }
    .stat {
      flex: 1; text-align: center;
      background: rgba(255,255,255,0.12); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.16); border-radius: 13px;
      padding: 7px 4px;
    }
    .stat .v { font-size: 1.15rem; font-weight: 800; color: #fff; line-height: 1.1; }
    .stat .l { font-size: 0.56rem; font-weight: 700; color: rgba(255,255,255,0.62);
               text-transform: uppercase; letter-spacing: 0.6px; margin-top: 1px; }

    /* ── Alert banner ── */
    .alert-banner {
      position: absolute; left: 12px; right: 12px;
      top: calc(env(safe-area-inset-top, 0px) + 74px);
      z-index: 20;
      background: linear-gradient(135deg, #e67e22, #f4722b);
      border-radius: 16px; padding: 13px 16px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      transform: translateY(-140%); opacity: 0;
      transition: transform 0.38s cubic-bezier(0.34,1.4,0.64,1), opacity 0.3s;
    }
    .alert-banner.show { transform: translateY(0); opacity: 1; }
    .alert-banner.urgent { background: linear-gradient(135deg, #c0392b, #e74c3c); }
    .alert-banner i { font-size: 1.5rem; color: #fff; flex-shrink: 0; }
    .alert-banner .txt { flex: 1; color: #fff; font-size: 0.88rem; font-weight: 700; line-height: 1.35; }

    /* ── Bottom controls ── */
    .hud-bottom {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 15;
      padding: 20px 16px calc(env(safe-area-inset-bottom, 0px) + 20px);
      background: linear-gradient(to top, rgba(10,20,16,0.94), rgba(10,20,16,0));
      display: flex; align-items: center; justify-content: center; gap: 16px;
    }
    .round-btn {
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);
      border: 1.5px solid rgba(255,255,255,0.22);
      color: #fff; font-size: 1.2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, background 0.2s;
    }
    .round-btn:active { transform: scale(0.9); }
    .round-btn.muted { background: rgba(192,57,43,0.5); border-color: rgba(231,76,60,0.6); }

    .go-btn {
      width: 86px; height: 86px; border-radius: 50%;
      background: linear-gradient(135deg, #2d6a4f, #52b788);
      border: 4px solid rgba(255,255,255,0.22);
      color: #fff; font-family: 'Poppins', sans-serif;
      font-size: 0.82rem; font-weight: 800; letter-spacing: 0.5px;
      cursor: pointer; box-shadow: 0 10px 30px rgba(45,106,79,0.6);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      transition: transform 0.15s;
    }
    .go-btn i { font-size: 1.4rem; }
    .go-btn:active { transform: scale(0.93); }
    .go-btn.running { background: linear-gradient(135deg, #c0392b, #e74c3c); box-shadow: 0 10px 30px rgba(192,57,43,0.6); }

    .report-btn { background: linear-gradient(135deg, #f4722b, #ff9a5c); border-color: rgba(255,255,255,0.3); }

    /* ── Report sheet ── */
    .sheet-overlay {
      position: fixed; inset: 0; z-index: 40;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(3px);
      opacity: 0; pointer-events: none; transition: opacity 0.28s;
    }
    .sheet-overlay.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
      background: #fff; border-radius: 26px 26px 0 0;
      padding: 14px 18px calc(env(safe-area-inset-bottom, 0px) + 22px);
      transform: translateY(105%);
      transition: transform 0.4s cubic-bezier(0.34,1.4,0.64,1);
      max-width: 520px; margin: 0 auto;
    }
    .sheet.open { transform: translateY(0); }
    .sheet-handle { width: 42px; height: 4px; background: #dde2e6; border-radius: 2px; margin: 2px auto 14px; }
    .sheet h3 { font-size: 1.02rem; font-weight: 800; color: #1a1a2e; margin-bottom: 3px; }
    .sheet p  { font-size: 0.76rem; color: #8a929a; margin-bottom: 15px; }
    .haz-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
    .haz-opt {
      background: #f5f7f8; border: 2px solid transparent; border-radius: 15px;
      padding: 13px 4px 10px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      transition: transform 0.12s, border-color 0.2s;
      font-family: 'Poppins', sans-serif;
    }
    .haz-opt:active { transform: scale(0.93); }
    .haz-opt i { font-size: 1.28rem; }
    .haz-opt span { font-size: 0.6rem; font-weight: 700; color: #4a5560; text-align: center; line-height: 1.2; }

    .toast {
      position: fixed; left: 50%; bottom: 130px; transform: translateX(-50%) translateY(20px);
      z-index: 60; background: #1a1a2e; color: #fff;
      padding: 11px 20px; border-radius: 50px;
      font-size: 0.84rem; font-weight: 700;
      opacity: 0; pointer-events: none; transition: all 0.3s;
      box-shadow: 0 8px 26px rgba(0,0,0,0.35);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .gps-badge {
      position: absolute; z-index: 12;
      top: calc(env(safe-area-inset-top, 0px) + 74px); left: 50%;
      transform: translateX(-50%);
      background: rgba(10,20,16,0.8); backdrop-filter: blur(6px);
      color: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.14);
      padding: 6px 14px; border-radius: 50px;
      font-size: 0.7rem; font-weight: 600;
      display: none; align-items: center; gap: 7px;
    }
    .gps-badge.show { display: flex; }
    .gps-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #f1c40f; animation: blink 1.4s infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

    /* Rider position marker */
    .me-marker { width: 22px; height: 22px; position: relative; }
    .me-dot {
      position: absolute; inset: 0; border-radius: 50%;
      background: #2979ff; border: 3px solid #fff;
      box-shadow: 0 0 0 rgba(41,121,255,0.6); animation: pulseMe 2.2s infinite;
    }
    @keyframes pulseMe {
      0%   { box-shadow: 0 0 0 0 rgba(41,121,255,0.55); }
      70%  { box-shadow: 0 0 0 16px rgba(41,121,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(41,121,255,0); }
    }
    .me-cone {
      position: absolute; left: 50%; top: 50%;
      width: 0; height: 0; transform-origin: 0 0;
      border-left: 13px solid transparent; border-right: 13px solid transparent;
      border-bottom: 26px solid rgba(41,121,255,0.34);
    }
    .maplibregl-ctrl-attrib { font-size: 9px; }
  </style>
</head>
<body>

<div id="map"></div>

<div class="hud-top">
  <a class="back-btn" href="dashboard.html"><i class="fa-solid fa-arrow-left"></i></a>
  <div class="stats">
    <div class="stat"><div class="v" id="s-dist">0.0</div><div class="l">km</div></div>
    <div class="stat"><div class="v" id="s-time">0:00</div><div class="l">time</div></div>
    <div class="stat"><div class="v" id="s-speed">0</div><div class="l">km/h</div></div>
    <div class="stat"><div class="v" id="s-ahead">0</div><div class="l">ahead</div></div>
  </div>
</div>

<div class="gps-badge" id="gps-badge"><span class="dot"></span><span id="gps-text">Getting GPS…</span></div>

<div class="alert-banner" id="alert-banner">
  <i class="fa-solid fa-triangle-exclamation" id="alert-icon"></i>
  <div class="txt" id="alert-text"></div>
</div>

<div class="hud-bottom">
  <button class="round-btn" id="mute-btn" title="Mute voice"><i class="fa-solid fa-volume-high"></i></button>
  <button class="go-btn" id="go-btn"><i class="fa-solid fa-play"></i><span id="go-label">START</span></button>
  <button class="round-btn report-btn" id="report-btn" title="Report hazard"><i class="fa-solid fa-plus"></i></button>
</div>

<div class="sheet-overlay" id="sheet-overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <h3>What did you see?</h3>
  <p>One tap warns every rider behind you.</p>
  <div class="haz-grid" id="haz-grid"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script type="module" src="js/ride-screen.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
