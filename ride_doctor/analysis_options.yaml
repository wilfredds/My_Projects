# Strict lint set. Rules are only relaxed here with a written reason.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    # Generated code is not ours to lint.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/generated/**
    # Frozen snapshots of past database schemas, generated by drift_dev.
    - test/generated_migrations/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # This is an application, not a published library: requiring a doc comment
    # on every public member produces noise ("/// The title.") that hides the
    # comments that matter. We document *why*, where the why is not obvious.
    public_member_api_docs: false
