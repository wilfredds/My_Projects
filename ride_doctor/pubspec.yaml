name: ride_doctor
description: "Ride Doctor - a personal cycling coach that diagnoses, trains and race-preps riders."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

# Dependency policy: a package is added in the phase that first uses it, never
# earlier. An unused dependency is an unverified dependency - it can break the
# build without any of our code exercising it. See docs/DECISIONS.md (ADR-0003).
dependencies:
  drift: ^2.35.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management + compile-safe dependency injection.
  flutter_riverpod: ^3.5.0

  # Declarative, deep-linkable navigation.
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4

  # Message formatting for the generated localizations.
  http: ^1.6.0
  intl: ^0.20.3

  # Material Design widgets. Since Flutter 3.47 these live in their own package;
  # `package:flutter/material.dart` is deprecated. See ADR-0002.
  material_ui: ^1.11.1

  # @immutable for framework-free domain classes.
  meta: ^1.17.0

  path: ^1.9.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.8
  sqlite3: ^3.9.1
  uuid: ^4.6.0

dev_dependencies:
  # Code generation (providers now; freezed and drift join in Phase 1).
  build_runner: ^2.17.1

  drift_dev: ^2.35.3
  flutter_test:
    sdk: flutter

  freezed: ^4.0.3
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  riverpod_generator: ^4.0.10

  # Strict lint set.
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  # Runs `flutter gen-l10n` automatically on `flutter pub get` / build.
  generate: true

  # Bundled (not downloaded at runtime) so the app is fully offline-first.
  # Both families are SIL Open Font License 1.1 - see assets/fonts/OFL-*.txt.
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700

# Native build options (Dart "hooks"). This makes package:sqlite3 bundle
# SQLite3 Multiple Ciphers - SQLite with encryption built in - instead of plain
# SQLite, on every platform including the machine that runs the tests.
# See docs/DECISIONS.md, ADR-0005.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
